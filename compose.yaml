services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    volumes:
      - ./data:/src/data:ro
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.web.rule: Host(`scan.innomaker.com.br`)
      traefik.http.routers.web.entrypoints: https
      traefik.http.routers.web.tls.certresolver: cloudflare
      traefik.http.services.web.loadbalancer.server.port: "5173"

networks:
  proxy:
    external: true
