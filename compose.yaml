services:
  web:
    networks:
      -  proxy
    build:
      context: .   # Points to the folder containing your Dockerfile
      dockerfile: Dockerfile       # Name of the Dockerfile (default is Dockerfile)
    container_name: web
    restart: unless-stopped
    volumes:
      - ./data:/src/data:ro
    labels:
      traefik.enable: 'true'
      traefik.docker.network: 'proxy'

      # --- Portal router: https:/innomaker.com.br ---
      traefik.http.routers.web.rule: 'Host(`scan.innomaker.com.br`)'
      traefik.http.routers.web.entrypoints: 'https'
      traefik.http.routers.web.tls.certresolver: 'cloudflare'
      traefik.http.services.web.loadbalancer.server.port: '5173'

networks:
  proxy:
    external: true
